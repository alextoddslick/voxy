def gl41MetalNativeDir = layout.buildDirectory.dir("gl41metal-native")
def gl41MetalShaderDir = layout.buildDirectory.dir("gl41metal-shaders")

tasks.register('compileGl41MetalNative', Exec) {
    description = 'Compiles the macOS GL41Metal JNI library'
    group = 'build'
    onlyIf { isMacOsHost }

    def outputDir = gl41MetalNativeDir.get().asFile
    def outputLib = new File(outputDir, 'libvoxy_gl41metal.dylib')
    def javaHome = System.getProperty('java.home')
    def nativeSources = fileTree('src/main/native/gl41metal') {
        include '**/*.mm'
    }
    def nativeHeaders = fileTree('src/main/native/gl41metal') {
        include '**/*.h'
    }

    inputs.files(nativeSources)
    inputs.files(nativeHeaders)
    outputs.file(outputLib)

    doFirst {
        outputDir.mkdirs()
        def sources = nativeSources.files.sort { it.path }.collect { it.path }
        commandLine(
                ['clang++',
                 '-std=c++17',
                 '-ObjC++',
                 '-fobjc-arc',
                 '-Wall',
                 '-Wextra',
                 '-Werror',
                 '-Wno-deprecated-declarations',
                 '-dynamiclib',
                 '-I', "${javaHome}/include",
                 '-I', "${javaHome}/include/darwin",
                 '-I', 'src/main/native/gl41metal'] +
                        sources +
                        ['-framework', 'Foundation',
                         '-framework', 'Metal',
                         '-framework', 'IOSurface',
                         '-framework', 'OpenGL',
                         '-framework', 'CoreVideo',
                         '-o', outputLib.absolutePath])
    }
}

tasks.register('compileGl41MetalShaders', Exec) {
    description = 'Compiles GL41Metal Metal shaders into a build-time library'
    group = 'build'
    onlyIf { isMacOsHost }

    def outputDir = gl41MetalShaderDir.get().asFile
    def outputLibrary = new File(outputDir, 'voxy_gl41metal.metallib')
    def shaderSources = fileTree('src/main/native/gl41metal/shaders') {
        include '**/*.metal'
    }

    inputs.files(shaderSources)
    outputs.file(outputLibrary)

    doFirst {
        outputDir.mkdirs()
        def sources = shaderSources.files.sort { it.path }.collect { it.path }
        if (sources.isEmpty()) {
            throw new GradleException('No GL41Metal shader sources found')
        }
        commandLine(['xcrun', 'metal', '-std=metal3.0'] + sources + ['-o', outputLibrary.absolutePath])
    }
}

processResources {
    if (isMacOsHost) {
        dependsOn 'compileGl41MetalNative'
        dependsOn 'compileGl41MetalShaders'

        from(gl41MetalNativeDir) {
            include 'libvoxy_gl41metal.dylib'
            into 'natives/macos'
        }
        from(gl41MetalShaderDir) {
            include 'voxy_gl41metal.metallib'
            into 'natives/macos/gl41metal'
        }
    }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    if (isMacOsHost) {
        dependsOn 'compileGl41MetalNative'
        dependsOn 'compileGl41MetalShaders'
    }
}



tasks.register('makeExcludedRocksDB', Zip) {
    archiveExtension.set("jar")
    entryCompression = ZipEntryCompression.STORED
    destinationDirectory.set temporaryDir

    dependsOn configurations.includeInternal

    def files = configurations.includeInternal.incoming.getArtifacts().getArtifactFiles().filter {
        it.name.startsWith('rocksdb')
    }
    
    from {->zipTree(files.first())}
    archiveFileName.set(providers.provider{files.first().name})

    exclude {
        def file = it.name
        // Keep the Apple-silicon macOS native: this fork's gl41metal backend targets arm64 Macs,
        // and RocksDB's NativeLibraryLoader hard-fails when its platform jnilib is missing.
        if (file.contains("osx-arm64")) {
            return false
        }
        if (file.endsWith(".jnilib")) {
            return true
        }
        if (!file.endsWith(".so")) {
            return false
        }
        return ["osx", "linux32", "musl", "s390x", "riscv64", "ppc64le", "aarch64"].any(file::contains)
    }
}

processIncludeJars {
    outputs.cacheIf {true}

    dependsOn makeExcludedRocksDB
    jars = jars.filter {!it.name.startsWith('rocksdb')}
    jars.from(makeExcludedRocksDB)
}

remapJar {
    doFirst {
        delete fileTree(getDestinationDirectory().get())
    }

    if (!isInGHA) {
        def hash = gitCommitHash();
        if (!hash.equals("<UnknownCommit>")) {
            archiveClassifier.set(hash);
        }
    }
}

