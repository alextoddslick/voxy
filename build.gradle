version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }

    exclusiveContent {
        forRepository {
            ivy {
                name = "github"
                url = "https://github.com/"
                patternLayout {
                    artifact '/[organisation]/[module]/releases/download/[revision]/[module]-[revision]-[classifier].[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModuleByRegex("[^\\.]+", "nvidium")
        }
    }
}


def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', 'HEAD']
            ignoreExitValue = true
        }

        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>";
        } else {
            return result.standardOutput.asText.get().strip();
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>";
    }
}

def buildtime = {System.currentTimeSeconds()}

processResources {
    def time = buildtime()
    def hash = gitCommitHash()
    def version = project.version

    inputs.properties("version": version, "commit": hash, "buildtime": time)
    filesMatching("fabric.mod.json") {
        expand "version": version, "commit": hash, "buildtime": time
    }
}

loom {
    accessWidenerPath = file("src/main/resources/voxy.accesswidener")

    runs {
        client {
            // Pass the render backend selection through to the game JVM (auto/gl46/gl41metal)
            property 'voxy.renderBackend', System.getProperty('voxy.renderBackend', 'auto')

            // GL41Metal backend tunables/debug switches (see Gl41MetalConfig)
            [
                'voxy.gl41metal.slotCount'            : '3',
                'voxy.gl41metal.waitTimeoutMs'        : '6',
                'voxy.gl41metal.reprojection'         : 'true',
                'voxy.gl41metal.reprojRefine'         : 'true',
                'voxy.gl41metal.maxInFlightSubmits'   : '2',
                'voxy.gl41metal.visibleComposite'     : 'true',
                'voxy.gl41metal.residencyMaxSections' : '262144',
                'voxy.gl41metal.geometryCapacityMb'   : '256',
                'voxy.gl41metal.uploadModelAtlas'     : 'true',
                'voxy.gl41metal.maxNodes'             : '2097152',
                'voxy.gl41metal.maxTraversalQueue'    : '200000',
                'voxy.gl41metal.maxTraversalRequests' : '1024',
                'voxy.gl41metal.maxWorklistItems'     : '400000',
                'voxy.gl41metal.dumpShaders'          : 'false',
                'voxy.gl41metal.manualDepthMask'      : 'true',
                'voxy.gl41metal.boundVerticalMargin'  : '1',
                'voxy.gl41metal.boundHorizontalMargin': '0',
                'voxy.gl41metal.boundAddDelayFrames'  : '1',
                'voxy.gl41metal.meshBatchSize'        : '32',
                'voxy.fluidBridgeWalls'               : 'true',
            ].each { key, defaultValue ->
                property key, System.getProperty(key, defaultValue)
            }

            // -PautoJoin=host:port joins a server on launch (headless smoke tests)
            if (project.hasProperty('autoJoin')) {
                programArgs '--quickPlayMultiplayer', project.property('autoJoin').toString(),
                        '--username', 'VoxyTester'
            }
        }
    }
}

